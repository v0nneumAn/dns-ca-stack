# Illustrative Pi-hole certificate renewal config; not a production backup.
DOMAIN="pihole.lan.example"
ALT_NAMES="192.0.2.10"
ACME_SERVER="https://ca.lan.example/acme/acme/directory"

# The DNS service owns the validation ports, so stop it for standalone HTTP-01.
PRE_HOOK="cd /srv/dns-ca-stack && docker compose stop pihole"
ALWAYS_HOOK="cd /srv/dns-ca-stack && docker compose up -d pihole"

CERT_DIR="/srv/example-certs/pihole"
KEY_OWNER="1000:1000"
TLS_PEM="yes"
