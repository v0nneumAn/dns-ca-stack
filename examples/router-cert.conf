# Illustrative OpenWrt certificate renewal config; not a production backup.
DOMAIN="router.lan.example"
ALT_NAMES="192.0.2.1"
ACME_SERVER="https://ca.lan.example/acme/acme/directory"

# OpenWrt packages acme.sh in a non-standard location.
ACME_SH="/usr/lib/acme/client/acme.sh"
LE_WORKING_DIR="/root/.acme.sh"

# uhttpd owns the validation port.
PRE_HOOK="/etc/init.d/uhttpd stop"
ALWAYS_HOOK="/etc/init.d/uhttpd start"

# uhttpd consumes the full chain and private key separately.
FULLCHAIN_FILE="/etc/uhttpd.crt"
KEY_FILE="/etc/uhttpd.key"
